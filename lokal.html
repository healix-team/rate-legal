<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rATE</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #2a1f14; color: #f6efe4; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 72px 24px; text-align: center; }
    .brand { font-weight: 800; font-size: 40px; letter-spacing: -0.5px; }
    .brand span { color: #d9a45b; }
    p { color: rgba(246,239,228,0.75); margin: 14px 0 30px; }
    a.button { display: block; background: #d9a45b; color: #2a1f14; font-weight: 700; text-decoration: none; padding: 16px; border-radius: 16px; margin-top: 12px; }
    a.secondary { background: transparent; color: #f6efe4; border: 1px solid rgba(246,239,228,0.3); }
    .hint { font-size: 14px; margin-top: 28px; }
  </style>
</head>
<body>
<main>
  <div class="brand">r<span>ATE</span></div>
  <p lang="de">Bewerte dieses Lokal mit deinen Freunden – ehrlich, im Vergleich statt mit Sternen.</p>
  <a class="button" id="open" href="#">In rATE öffnen</a>
  
  <p class="hint" lang="en">Rate this place with your friends on rATE.</p>
</main>
<script>
  var id = new URLSearchParams(location.search).get('id') || '';
  var link = /^[0-9a-f-]{36}$/i.test(id) ? 'ratefood://restaurant/' + id + '?placeId=' + id : 'ratefood://';
  // No automatic redirect: without the app, Safari would show "cannot open the page" instead of this page.
  document.getElementById('open').href = link;
</script>
</body>
</html>
